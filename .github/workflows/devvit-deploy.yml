name: Devvit Upload

on:
  push:
    branches:
      - main
    paths:
      - 'devvit/**'
      - '.github/workflows/devvit-deploy.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devvit
    env:
      DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run test:types
      - run: npm run test:unit
      - run: npm run build
      - name: Upload Devvit app
        run: npx devvit upload
